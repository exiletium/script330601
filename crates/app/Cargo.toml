[package]
name = "noesis"
description = "Noesis desktop app and command-line interface"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "noesis_app"
path = "src/lib.rs"

[[bin]]
name = "noesis"
path = "src/main.rs"

[[bin]]
name = "noesis-desktop"
path = "src/bin/noesis-desktop.rs"
required-features = ["gui"]

[features]
default = ["gui", "gpu"]
gui = ["dep:eframe"]
gpu = ["noesis/gpu"]

[dependencies]
noesis = { package = "noesis-engine", path = "../engine", default-features = false }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
chrono = "0.4"
eframe = { version = "0.31", optional = true, default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }

