name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test engine
        run: cargo test -p noesis-engine --no-default-features
      - name: Build app (release)
        run: cargo build --release -p noesis
      - name: Smoke test CLI
        run: cargo run --release -p noesis -- --short "integrate x^2 sin(x) dx"
      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: noesis-${{ matrix.os }}
          path: |
            target/release/noesis
            target/release/noesis-desktop
            target/release/noesis.exe
            target/release/noesis-desktop.exe
          if-no-files-found: ignore
